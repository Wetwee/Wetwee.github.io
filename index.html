  <h1>Геометрия феррического вакуума</h1>
  <p>Мирный · Бородин · Прейзах</p>

  <h2>Интеграл БПМ</h2>
  <p>$$K_{ret} = \int_0^{H_{PM}} \frac{\sinh(H)}{H} \cdot \exp\!\left(\frac{1}{H_{PM}}\right) \frac{4\pi^2}{\sqrt{3}} \to 137.036$$</p>

  <p>где $$H_{PM} = \pi - \frac{1}{\varphi} \approx 2.5236$$ — коэрцитивный порог Прейзаха–Мирного.</p>
